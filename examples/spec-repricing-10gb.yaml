# Repricing-template rehearsal fixture (~10 GB benchmark targets +
# ~10 GB synthetic extras).
#
# Goal: drive an end-to-end run of state-actor's --spec surface against
# execution-specs PR 2637's `fill-stateful` workflow, at a size that
# fits on a single SSD (vs the 300 GB spec-mainnet-shape.yaml run).
#
# Three explicit entities planted at canonical stubs_repricing.json
# addresses, plus a synthetic-fill cap that adds ~10 GB of unrelated
# accounts/contracts on top so the surrounding state isn't trivially
# small.
#
# To build the chaindata (state-actor's CLI as of PR 75: --target-size
# drives the mainnet-shaped auto-fill; no per-knob counts):
#
#   ./state-actor --client=geth \
#     --db=/media/jochem/research-disk/bench-state-actor-template-test/state-actor-out/geth/chaindata \
#     --spec=examples/spec-repricing-10gb.yaml \
#     --target-size=20GB \
#     --fork=osaka \
#     --chain-id=1337 \
#     --seed=42 \
#     --verbose 2>&1 | tee /media/jochem/research-disk/bench-state-actor-template-test/logs/gen.log
#
# Expected composition (on-disk total; geth's flat-state layer adds
# ~70-78 B/slot on top of the 140 B/slot trie cost = ~218 B/slot total):
#   10 GB ERC-20 storage   ≈ 45.9M owners → ~10 GB on disk
#   1.5 GB bloated EOA      ≈ 7.6M slots   → ~1.5 GB on disk
#   Bittrex 1.5M CREATE chain (contracts)  → ~260 MB account-trie + ~150 MB code
#   synthetic fill                          → capped by --target-size
#   total on disk                          ≈ 20 GB
#
# NOTE on the ERC-20: we use `total_owners` to drive storage size, NOT
# `approximate_size_bytes`. The erc20 template currently ignores
# approximate_size_bytes — a pre-PR-76 gap (introduced in PR 75 alongside
# the owners/allowances knobs) that will be fixed in a follow-up PR. The
# canonical conversion is `total_owners = approximate_size_bytes /
# bytes_per_slot` (140 B/slot trie-only, or ~218 B/slot if you want
# 'on disk'); the value below targets 10 GB on disk.
#
# Time budget: 10-30 min depending on disk. RAM peak ~30 GiB (streamsort
# cap, same as spec-mainnet-shape.yaml).
#
# Addresses are taken verbatim from
# execution-specs/tests/benchmark/stateful/stubs/stubs_repricing.json
# so the canonical stubs file resolves to entities we actually planted.
# The ERC-20 slot is the `9_39GB_ERC20` entry, oversized here to 10 GiB
# so fill-stateful's `test_sload_empty_erc20_balanceof_9_39GB_ERC20`
# variant has real storage to read against.
entities:
  # ── Pre-funded seed EOA for fill-stateful ────────────────────────────
  # Canonical Hardhat/Anvil dev key #0 — address derives from private key
  # 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80.
  # Pin via `fill-stateful --rpc-seed-key=0xac0974…ff80` for reproducible
  # runs. Balance is 1M ETH = 10^24 wei (0x33b2e3c91efc989409c0000) so
  # transient seed-key drains across many fill iterations stay safe.
  - kind: eoa
    name: fill-stateful-seed
    address: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
    balance: "0x33b2e3c91efc989409c0000"

  # ── 10 GB ERC-20 ─────────────────────────────────────────────────────
  # Backs test_sload_empty_erc20_balanceof_9_39GB_ERC20,
  # test_sstore_erc20_mint_9_39GB_ERC20,
  # test_sstore_erc20_approve_9_39GB_ERC20,
  # test_mixed_sload_sstore_9_39GB_ERC20. Sized at 10 GB rather than
  # 9.39 GB because the bench-state-actor-template-test budget rounds up.
  - kind: contract
    name: erc20-9-39gb
    template: erc20
    address: 0xf7EfF64A1b7f3dB550A05fF2635Bb9744B8E21eb
    parameters:
      symbol: BLOAT10G
      name: Bloated 10 GB ERC-20
      decimals: 18
      # 10 GB on-disk target ÷ ~218 B/slot (140 B trie + ~78 B flat-state)
      # ≈ 45.87M slots. Each random owner takes one slot in _balances.
      total_owners: 45_872_000

  # ── 1 GB bloated EOA (storage_pattern) ───────────────────────────────
  # Backs the bloated_eoa_1GB stub (test_sload_bloated /
  # test_sstore_bloated existing_slots=True path). final ≈ 1 GiB / 140 B
  # so slot 0 holds 7_668_584 (next-free pointer) and slot k = k for
  # k in 1..7_668_583.
  - kind: contract
    name: bloated-eoa-1gb
    template: storage_pattern
    address: 0x3f8074692982594c1936bd27433a8b6e5d77e0f0
    nonce: 1
    balance: "1000000000000000000"
    parameters:
      final: 7668583

  # ── Bittrex-style CREATE chain (create_preimage_deploys) ────────────
  # Backs CreatePreimageLayout / EXISTING_CONTRACT mode of
  # test_account_access. Full production scale (1.5M nonces) since the
  # account-trie cost is only ~260 MB and this is the one chance to
  # exercise the template at its real size before the 300 GB run.
  # `runtime = JUMP(PUSH2(0x5FFF)) + JUMPDEST` — same body the smoke
  # fixture uses; callable by the benchmark's setup transactions.
  - kind: contract
    name: bittrex-create-preimage
    template: create_preimage_deploys
    parameters:
      sender: "0xA3C1E324CA1CE40DB73ED6026C4A177F099B5770"
      start_nonce: 2
      count: 1500000
      runtime: "0x615fff565b"
