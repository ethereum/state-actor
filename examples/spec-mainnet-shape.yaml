# Mainnet-shape genesis fixture with two repricing-bench probes layered
# on top.
#
# Mirrors `geth inspect-trie` mainnet composition (May-19 measurement):
#   account trie    ~55 GiB
#   storage tries   ~136 GiB
#   storage tries   ~26.1M (count)
# Trie-only sizes; geth flat-state adds ~78 B/slot on top, taking the
# on-disk total to ~300 GiB. See internal/sizecal/factors.go for the
# per-slot / per-account calibration constants (140 B / 175 B).
#
# Synthetic-fill flags drive the bulk; this YAML declares only the two
# specific entities the bloatnet benchmarks expect at fixed addresses.
#
# To build the chaindata (state-actor's CLI as of PR 75: --target-size
# drives the mainnet-shaped auto-fill in mainnet 20/10/70 proportions;
# the previous --accounts/--contracts/--min-slots/--max-slots/
# --distribution flags were removed):
#
#   ./state-actor --client=geth \
#     --db=/media/jochem/research-disk/tmp/mainnet-shape/geth/chaindata \
#     --spec=examples/spec-mainnet-shape.yaml \
#     --target-size=220GB \
#     --fork=osaka \
#     --chain-id=1337 \
#     --seed=42 \
#     --verbose 2>&1 | tee /media/jochem/research-disk/tmp/mainnet-shape/gen.log
#
# Expected composition (with the autofill targeting mainnet 20/10/70):
#   bloater (storage_pattern)    = 153,391,690 slots → ~20 GiB trie
#   autofill account/code/storage proportions per
#   internal/autofill (20/10/70 of the remaining budget).
#   total trie                  ≈ 220 GiB  (--target-size cap)
#   on-disk including flat      ≈ 300 GiB
#
# Time budget: 2–6 hours; RAM peak ≈ 30 GiB (streamsort cap from PR 75).
# Disk: needs ~320 GiB free at the --db path.
#
# NOTE: truncateForTargetSize currently undercounts non-
# `approximate_size_bytes` template storage (storage_pattern,
# create_preimage_deploys, create2_deploys, sequential_eoas). Until that
# is fixed (see TODO in internal/specbuild/build.go) the spec entities
# may push the total above --target-size by their actual slot/account
# count. For the bloater here (153M slots ~ 20 GiB), expect 320-340 GiB
# on-disk at --target-size=220GB.
#
# To boot upstream geth against the produced datadir afterwards:
#
#   docker run --rm -d --name geth-mainnet-shape \
#     -v /media/jochem/research-disk/tmp/mainnet-shape:/data \
#     -p 127.0.0.1:8545:8545 \
#     ethereum/client-go:v1.17.2 \
#     --datadir=/data --db.engine=pebble --networkid=1337 \
#     --syncmode=full --nodiscover --maxpeers=0 \
#     --http --http.addr=0.0.0.0 --http.port=8545 \
#     --http.api=eth,net,web3,debug \
#     --verbosity=3
entities:
  # 20 GB bloated EOA — storage_pattern at the bloated_eoa_20GB stub
  # address from
  # execution-specs/tests/benchmark/stateful/stubs/stubs_repricing.json.
  # 20 GiB ÷ 140 B/slot ≈ 153,391,690 → final = 153_391_689 so slot 0
  # holds 153_391_690 (next-free pointer) and slot k = k for k in
  # 1..final. Matches test_sload_bloated / test_sstore_bloated's
  # existing_slots=True invariant.
  - kind: contract
    name: bloated-eoa-20g
    template: storage_pattern
    address: 0x772604ee92ebc9afa5b6ce561f6f6a4c4cdd214a
    nonce: 1
    balance: "1000000000000000000"
    parameters:
      final: 153391689

  # 150,000 sequential EOAs starting at 0x...001000. Backs
  # SequentialAddressLayout(starting_address=0x1000, increment=1) in
  # execution-specs bloatnet test_account_access EXISTING_EOA mode.
  - kind: contract
    name: sequential-eoas-150k
    template: sequential_eoas
    address: 0x0000000000000000000000000000000000001000
    parameters:
      count: 150000
      balance: "1000000000000000000"
