# Sub-second SMOKE fixture for the repricing-benchmark templates.
#
# Purpose: exercise each of the six user-visible templates introduced
# for bloatnet repricing (sequential_eoas, sequential_pkey_eoas,
# storage_pattern, create2_factory, create2_deploys,
# create_preimage_deploys) once at tiny size, so
# internal/specbuild/build_repricing_test.go can run the full parse →
# validate → build pipeline end-to-end in milliseconds. Used as the
# canary that the example file, docs/SPEC.md, and the six repricing
# templates stay in sync.
#
# NOT a benchmark prestate. Counts are 1-10 — far below the
# 150_000-account minimum that a 300 M-gas repricing benchmark
# requires. For a fixture sized to actually drive a 300 M-gas
# benchmark, see the sibling `spec-repricing-min.yaml` in this testdata
# directory. For the ~10 GB rehearsal scale (full ERC-20 + bloated EOA +
# Bittrex), see `examples/spec-repricing-10gb.yaml`.
#
# ── Fork relevance ────────────────────────────────────────────────────
#
# These benchmarks measure the gas repricing that ships in Glamsterdam
# (the fork immediately after Amsterdam). The state itself, however,
# targets the FUSAKA fork — the EVM rules a benchmark replays against
# are Fusaka's, not Glamsterdam's, because that's the baseline the
# repricing measures change FROM. State-actor's --fork flag should be
# `fusaka` (or, today, `osaka` for the current devnets — Fusaka is
# Amsterdam's predecessor on the post-merge fork ladder) when
# generating chaindata for these benchmarks.
#
# A pre-Amsterdam-specific code pattern (`code_pattern:
# unique_jumpdest_pre_amsterdam`) is used on the create2_deploys
# entry below; the per-derived runtime size is EIP-170's pre-Amsterdam
# 24 KiB cap. Amsterdam (EIP-7907) raises the limit, at which point a
# sibling `unique_jumpdest_amsterdam` pattern will be added; existing
# pre-Amsterdam fixtures keep working unchanged.
#
# This is a test fixture (consumed by build_repricing_test.go), not a
# user-facing example. To exercise it by hand anyway (smoke only — not a
# real benchmark prestate):
#   state-actor --client=geth --db=/tmp/repricing-smoke \
#     --spec=internal/specbuild/testdata/spec-repricing-smoke.yaml --fork=osaka
entities:
  # ── 1. Sequential EOAs at 0x1000+ ─────────────────────────────────────
  # Backs SequentialAddressLayout(starting_address=0x1000, increment=1)
  # in execution-specs bloatnet test_account_access (EXISTING_EOA mode).
  #
  # Production-scale minimum: 150_000 accounts. The benchmark spends
  # ~2000 gas per cold-address access (post-EIP-2929), so 150_000
  # accounts × 2000 gas = 300 million gas of headroom in the sequential
  # range. Any benchmark filled above that gas limit walks off the end
  # of the planted range and starts touching empty addresses, which
  # changes the measured cost — the result is invalid. If your
  # benchmark's `gas_benchmark_value` exceeds 300M (per benchmark
  # iteration), bump `count` proportionally:
  #
  #     count >= gas_benchmark_value / 2000
  #
  # This smoke fixture uses count=100 only because it's sub-second by
  # design and not measuring anything real.
  - kind: contract
    name: sequential-eoas-baseline
    template: sequential_eoas
    address: 0x0000000000000000000000000000000000001000
    parameters:
      count: 100
      balance: "1000000000000000000"

  # ── 2. Storage-pattern target ─────────────────────────────────────────
  # Backs the existing_slots=True path of test_sload_bloated and
  # test_sstore_bloated. The bloated_eoa_* addresses in
  # stubs_repricing.json all use this layout; here we just exercise it
  # at one synthetic address.
  - kind: contract
    name: storage-pattern-baseline
    template: storage_pattern
    address: 0x000000000000000000000000000000000000c0de
    parameters:
      final: 100

  # ── 3. CREATE2 factory ────────────────────────────────────────────────
  # Canonical Arachnid deterministic-deployment proxy. Same address
  # on every EVM chain because the deploy tx is pre-signed.
  - kind: contract
    name: create2-factory
    template: create2_factory
    address: 0x4e59b44847b379578588920cA78FbF26c0B4956C

  # ── 4. CREATE2 deploys ────────────────────────────────────────────────
  # 10 CREATE2-derived contracts using the unique-code-jumpdest pattern.
  # Backs the `diff_to_unique_code_jumpdest_contract` case of
  # test_ether_transfers_onchain_receivers in test_transaction_types.py;
  # production runs use a much larger salt_count (1.5M+).
  #
  # `code_pattern: unique_jumpdest_pre_amsterdam` opts into the named
  # generator (see internal/templates/code_pattern.go). The pattern
  # owns BOTH the initcode (a constant, used only for CREATE2 address
  # derivation via keccak256(initcode)) and the per-derived-address
  # runtime — each derived contract gets a 24 KiB runtime with its own
  # 20-byte address embedded at bytes 0x2C..0x40, JUMPDEST padding
  # filling the rest, and PUSH2 0x5FFF; JUMP at the start landing at
  # the final JUMPDEST.
  #
  # `initcode:` and `runtime:` are MUTUALLY EXCLUSIVE with
  # `code_pattern:` — the pattern owns both. To use a literal runtime
  # instead, drop `code_pattern:` and supply both `initcode:` and
  # `runtime:` directly.
  - kind: contract
    name: create2-deploys-baseline
    template: create2_deploys
    parameters:
      code_pattern: unique_jumpdest_pre_amsterdam
      salt_count: 10

  # ── 5. CREATE-preimage deploys ────────────────────────────────────────
  # Bittrex-style chain at the real mainnet Bittrex Controller address.
  # 10 nonces here vs the 1.5 M-nonce production scale. The sender is
  # a *parameter*, NOT the entity's `address:` field, so users can
  # declare a separate entity at 0xA3C1...5770 (e.g. with the actual
  # Bittrex Controller bytecode via `template: raw`) without colliding.
  #
  # runtime is the real on-mainnet bytecode of a Bittrex Controller
  # child contract (example at https://etherscan.io/address/
  # 0xe871313a20df727f5c226258414e4df2df2d9f41). Each child of the
  # Bittrex Controller carries this runtime AND has slot 0 set to the
  # parent controller's address — `storage_init` planted that here.
  # This matches what test_ether_transfers_onchain_receivers expects
  # for `case_id == "diff_to_contract"` (a clone of the real child's
  # runtime, with the controller address callable from slot 0).
  - kind: contract
    name: create-preimage-baseline
    template: create_preimage_deploys
    parameters:
      sender: "0xA3C1E324CA1CE40DB73ED6026C4A177F099B5770"
      start_nonce: 2
      count: 10
      runtime: ""
      storage_init:
        # Slot 0 on every Bittrex child = the parent controller address,
        # following the real on-mainnet invariant. The 20-byte address is
        # left-padded to a 32-byte slot value.
        "0x0": "0xa3c1e324ca1ce40db73ed6026c4a177f099b5770"

  # ── 6. Sender pool (pkey-derived EOAs) ──────────────────────────────
  # Backs `yield_distinct_sender()` in execution-specs
  # tests/benchmark/stateful/bloatnet/test_transaction_types.py.
  # Production scale: 150 000 senders to match `gas_benchmark_value /
  # 21000` headroom; this smoke just exercises the derivation at count=3.
  #
  # `0x2222…` is a deliberately-distinct base from the production
  # spec-repricing-min.yaml's `0x1111…` so a future test that builds
  # both fixtures back-to-back doesn't see colliding addresses.
  - kind: contract
    name: sender-pool-baseline
    template: sequential_pkey_eoas
    parameters:
      start_pkey: "0x2222222222222222222222222222222222222222222222222222222222222222"
      count: 3
      balance: "1000000000000000000"
