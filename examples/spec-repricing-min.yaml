# Production-minimum repricing-benchmark prestate (300 M-gas headroom).
#
# Setup to minimal repricing prestate as of execution-specs
# commit 6137bb32f9b8eda6194096992cb97b28be06957d
#
# Sized to be the smallest fixture that produces *valid* 300 million-gas
# iterations for every bloatnet repricing benchmark in
# execution-specs/tests/benchmark/stateful/. Below this scale a single
# iteration walks off the end of its planted range and starts touching
# empty addresses / unallocated slots, which shifts the measured gas
# cost and invalidates the benchmark.
#
# This is the entry point for "I just want to run the repricing
# benchmarks at the smallest valid size." For end-to-end rehearsal at
# ~10 GB on disk (full ERC-20 storage, 1 GB bloated EOA, 1.5 M-nonce
# Bittrex chain) use `examples/spec-repricing-10gb.yaml`. For sub-
# second schema smoke (used by build_repricing_test.go) use
# `examples/spec-repricing-smoke.yaml`.
#
# ── 300 M-gas headroom math (why the three count-based knobs are 150 000) ─
#
# All four cold-resource benchmarks share the same 2000 gas/access
# cost floor (post-EIP-2929 cold-address / cold-slot access):
#
#     entries_needed >= gas_benchmark_value / 2000
#     300_000_000 / 2_000 = 150_000
#
# This applies to:
#   * sequential_eoas   (cold address access on planted EOA range)
#   * create2_deploys   (cold address access on planted contract range,
#                        with unique 24 KiB code so per-contract
#                        bytecode-warm-up doesn't amortize)
#   * create_preimage_deploys (Bittrex's CREATE chain — cold contract
#                              access on every planted child)
#   * storage_pattern   (cold SLOAD on planted slots. NOTE: this fixture
#                        oversizes this ONE knob far past the 150 000
#                        floor — see entity 2, final = 335 545 082 — so
#                        it doubles as the 10 GB storage variant. 150 000
#                        slots is the minimum; extra populated slots only
#                        add SLOAD/SSTORE headroom, never reduce it.)
#
# Bumping the benchmark gas-target above 300 M REQUIRES bumping each of
# the three count-based knobs above proportionally:
#     count >= gas_benchmark_value / 2000
# storage_pattern already sits far above the floor, so it is unaffected.
#
# ── Fork relevance ────────────────────────────────────────────────────
#
# The repricing being measured ships in GLAMSTERDAM (the fork after
# Amsterdam). The prestate baseline is FUSAKA (Amsterdam's predecessor)
# — that's the EVM the benchmark replays against to establish the
# "from" cost the repricing changes. State-actor's --fork flag should
# be `fusaka` (or, today, `osaka` for current devnets, which is the
# spelling state-actor's --list-forks accepts).
#
# `code_pattern: unique_jumpdest_pre_amsterdam` is the pre-EIP-7907
# 24 KiB unique-code-jumpdest layout. After Amsterdam raises the code-
# size limit, swap to a sibling `unique_jumpdest_amsterdam` pattern;
# existing pre-Amsterdam fixtures (like this one) keep working.
#
# ── On-disk cost estimate ─────────────────────────────────────────────
#
# Per-component (geth flat-state + trie ≈ 218 B/account, 218 B/slot;
# code is deduplicated by hash):
#
#     150 000 sequential_eoas       ≈   33 MB   (account-trie only)
#     150 000 create2_deploys       ≈ 3.7  GB   (UNIQUE 24 KiB code per
#                                                 contract)
#     create2_factory               negligible
#     150 000 create_preimage       ≈   33 MB   (shared 600-B Bittrex
#                                                 runtime, planted once)
#     1 storage_pattern @ 335M slots≈  ~73 GB   (335 545 082 slots ×
#                                                 ~218 B/slot — the
#                                                 dominant cost in this
#                                                 fixture. "10 GB" in the
#                                                 entity name is the
#                                                 32-B/slot value-data
#                                                 size (~10.7 GB); on disk
#                                                 geth also stores each
#                                                 key + flat state, ≈218
#                                                 B/slot → ~73 GB)
#     prefunded seed EOA            negligible
#                                   ─────────
#                                   ≈ 77 GB on disk
#
# Build time scales with on-disk size: ~30-90 min for ~77 GB depending
# on disk. RAM peak ~8 GiB (streamsort cap is unaffected by entity
# count — the 335 M storage slots are streamed, not buffered).
#
# ── Run it ────────────────────────────────────────────────────────────
#
#   state-actor --client=geth \
#     --db=/media/jochem/research-disk/chaindata/repricing-min-fusaka \
#     --spec=examples/spec-repricing-min.yaml \
#     --fork=osaka \
#     --chain-id=1337 \
#     --seed=42 \
#     --gas-limit=85000000 \
#     --verbose
#
# `--gas-limit=85000000` (85 M) is required for filling on Amsterdam:
# EIP-7954 raises max contract code size to 32 KiB and EIP-8037 routes
# code-deposit through state-gas at 1530/byte, so a max-size
# JumpLoopGenerator deploy needs ~50.3 M state-gas. Tx.gas_limit
# encodes RegularGas = min(gas_limit, 16.78 M MaxTxGas) and StateGas
# = gas_limit - 16.78 M; the deploy tx therefore needs gas_limit
# ≥ 67 M, which only fits in a block that's at least that large.
#
# All four `--client={geth,besu,nethermind,reth}` backends should
# produce the same genesis state root for the same --seed (this is
# the cross-client-genesis-root invariant).
entities:
  # ── Pre-funded seed EOA for fill-stateful ────────────────────────────
  # Canonical Hardhat/Anvil dev key #0 — address derives from private key
  # 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80.
  # Pin via `fill-stateful --rpc-seed-key=0xac0974…ff80` for reproducible
  # runs. 1 M ETH (10^24 wei = 0x33b2e3c91efc989409c0000) is enough
  # rope for many fill iterations without re-funding.
  - kind: eoa
    name: fill-stateful-seed
    address: 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
    balance: "0x33b2e3c91efc989409c0000"

  # ── 1. Sequential EOAs at 0x1000+ ─────────────────────────────────────
  # Backs SequentialAddressLayout(starting_address=0x1000, increment=1)
  # in execution-specs bloatnet test_account_access (EXISTING_EOA mode).
  # 150 000 entries planted at 0x1000..0x2497F — gives 300 M gas of
  # cold-access headroom at the post-EIP-2929 rate of 2000 gas/access.
  # Used in repricing test test_account_access, the EXISTING_EOA
  - kind: contract
    name: sequential-eoas-300m
    template: sequential_eoas
    address: 0x0000000000000000000000000000000000001000
    parameters:
      count: 150000
      # Default balance is 1 wei (just enough to dodge EIP-161 pruning
      # of zero-balance plain EOAs); raise to a real value here so
      # benchmarks that ALSO probe balance/value-transfer cost can
      # source from these addresses without underflow.
      balance: "1000000000000000000"

  # ── 2. Storage-pattern target (reusable across SLOAD/SSTORE benches) ─
  # Backs the existing_slots=True path of test_sload_bloated and
  # test_sstore_bloated. One contract, 335 545 083 populated slots —
  # slot 0 holds the next-free pointer (final + 1 = 335545083), and
  # slot k = k for k in 1..335545082 (= final).
  # Reusable target for any benchmark that needs a cold-SLOAD or
  # cold-SSTORE-set sweep against an already-populated key range.
  # This is the 10 GB storage variant: final × 32 B of slot-value data
  # (335545082 * 32 = 10737442624 > 1024*1024*1024*10 = 10737418240),
  # i.e. ~10.7 GB of values. Actual on-disk cost is (much) higher
  # (~73 GB) because geth also stores each key + flat state (~218 B/slot).
  # This sets up the account used for sload_bloated and sstore_bloated
  # tests, for the 10gb variant.
  #
  # Address ↔ private-key pair (verified — pkey derives the address):
  #   address: 0x87a6314da5ac8832f6e7a176c8fb133b19f5be04
  #   pkey:    0x4da32d29f6dcffa26e09dc4e102033f2d105de1444fb893493ae703289275e0e
  #
  # The pair matches the canonical upstream `bloated_eoa_10GB` stub in
  # `execution-specs/tests/benchmark/stateful/stubs/stubs_repricing.json`,
  # so the same address state-actor plants here also resolves through
  # `pre.stub_eoa("bloated_eoa_10GB")` during fill-stateful runs — the
  # storage layout below directly satisfies the EIP-7702 / SLOAD /
  # SSTORE benchmarks' "existing_slots=True" parametrization.
  #
  # State-actor's spec schema has no `private_key` field; the key is
  # kept in this comment so anyone running fill-stateful or signing
  # txns FROM this address can copy it without re-deriving.
  - kind: contract
    name: storage-pattern-10gb
    template: storage_pattern
    address: 0x87a6314da5ac8832f6e7a176c8fb133b19f5be04
    nonce: 1
    balance: "1000000000000000000"
    parameters:
      final: 335545082

  # ── 3. CREATE2 factory ────────────────────────────────────────────────
  # Canonical Arachnid deterministic-deployment proxy. Same address on
  # every EVM chain because the deploy tx is pre-signed. Required for
  # the create2_deploys entry below to resolve its factory.
  - kind: contract
    name: create2-factory
    template: create2_factory
    address: 0x4e59b44847b379578588920cA78FbF26c0B4956C

  # ── 4. CREATE2-deployed unique-JUMPDEST contracts ─────────────────────
  # 150 000 derived contracts, each with a UNIQUE 24 KiB runtime (the
  # contract's own 20-byte address embedded at bytes 0x2C..0x40,
  # JUMPDEST padding everywhere else, PUSH2 0x5FFF; JUMP at the start
  # landing on a JUMPDEST at byte 0x5FFF — so no warm-up code path
  # short-circuits the benchmark).
  #
  # Backs the `diff_to_unique_code_jumpdest_contract` case of
  # test_ether_transfers_onchain_receivers in test_transaction_types.py
  # and the cold-contract-access path of test_account_access. Per-
  # contract code uniqueness defeats geth's code-cache by hash; per-
  # contract address uniqueness defeats trie-node sharing.
  - kind: contract
    name: create2-deploys-300m
    template: create2_deploys
    parameters:
      code_pattern: unique_jumpdest_pre_amsterdam
      salt_count: 150000

  # ── 6. SENDER pool for test_ether_transfers_onchain_receivers ────────
  # Backs `yield_distinct_sender()` in execution-specs
  # tests/benchmark/stateful/bloatnet/test_transaction_types.py — the
  # test constructs senders as `EOA(key=SENDER_BASE_KEY + i)` and
  # assumes the resulting addresses are pre-funded on-chain. The
  # production fixture pre-allocates this pool in genesis; we replicate
  # that here so the minimum fixture can satisfy the same tests.
  #
  # SENDER_BASE_KEY (verbatim from execution-specs) is
  # 0x1111111111111111111111111111111111111111111111111111111111111111;
  # the first 150 000 keys are funded. Sender #0 derives to
  # 0x19E7E376E7C213B7E7E7E46cc70A5dD086DAff2A; subsequent senders walk
  # the secp256k1 scalar field by integer addition.
  #
  # Sized at 150 000 to match the production pool's headroom: 30 M-gas
  # per-iteration benchmarks consume up to 1500 senders per fill;
  # 150 000 leaves room for the same scaling as the other 300 M-gas
  # knobs (sequential_eoas / create2_deploys / Bittrex chain) without
  # being the limiting factor.
  - kind: contract
    name: sender-pool-300m
    template: sequential_pkey_eoas
    parameters:
      start_pkey: "0x1111111111111111111111111111111111111111111111111111111111111111"
      count: 150000
      # 1 ETH/account. The fill-stateful tx generation pays gas_limit ×
      # gas_price + value per tx; 1 ETH per sender covers any single
      # 30 M-gas tx at realistic gas prices with multiple orders of
      # safety margin.
      balance: "1000000000000000000"

  # ── 5. CREATE-preimage deploys (Bittrex's CREATE chain) ──────────────
  # Bittrex Controller (0xA3C1...5770) is the canonical on-mainnet
  # CREATE-deployer of a 1.5 M-long descendant chain (each child the
  # result of CREATE(controller, nonce)). The full 1.5 M chain lives
  # in spec-repricing-10gb.yaml; for the 300 M-gas minimum we plant
  # only the first 150 000 children.
  #
  # `runtime:` below is the real on-mainnet bytecode of a Bittrex
  # Controller child contract (example at https://etherscan.io/address/
  # 0xe871313a20df727f5c226258414e4df2df2d9f41). Each child carries
  # this runtime AND has slot 0 set to the parent controller address
  # — the real on-mainnet invariant, restored here via `storage_init`.
  #
  # Used in repricing test test_account_access, the EXISTING_CONTRACT
  - kind: contract
    name: bittrex-create-preimage-300m
    template: create_preimage_deploys
    parameters:
      sender: "0xA3C1E324CA1CE40DB73ED6026C4A177F099B5770"
      start_nonce: 2
      count: 150000
      runtime: ""
      storage_init:
        # Slot 0 on every Bittrex child = the parent controller address,
        # following the real on-mainnet invariant. The 20-byte address
        # is left-padded to a 32-byte slot value.
        "0x0": "0xa3c1e324ca1ce40db73ed6026c4a177f099b5770"
