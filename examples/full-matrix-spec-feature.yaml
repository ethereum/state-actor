# Full-matrix CI fixture for the --spec feature.
#
# Touches every spec YAML code path so a single end-to-end CI job per
# client validates every writer + read invariant the bench host validates
# at 100 GB scale. Covers: ERC-20 + storage synth, near-EIP-170 raw
# bytecode, EIP-7702 delegation, zero-balance EOAs, hex-string balance
# form, explicit + bulk owners/allowances, and the spamoor sender pinned
# at Anvil dev account 0 so spamoor scenarios can sign txs against the
# datadir directly.
#
# **DO NOT USE THIS FIXTURE LOCALLY without `sizecal.NewFixed(64)`** —
# each client's calibration factor would otherwise produce different
# slot counts, breaking the cross-client invariant.
# internal/e2e_testing/spec_setup.go's LoadCISpec hardcodes NewFixed(64)
# so all clients agree.
#
# Total on-disk footprint target: ≤500 KB. The per-client TestE2ESuite
# (internal/e2e_testing/runphases.go) walks every entity below via the
# Go oracle and asserts balance/nonce/code/storage/template-output via
# JSON-RPC. Any divergence between the four clients fails the
# cross-client-genesis-root aggregator gate.
entities:
  # ── 1. Spamoor sender ────────────────────────────────────────────────
  # spamoor signs erc20_bloater txs with privkey=1 (the bench-host
  # SPAMOOR_PRIVKEY constant). The corresponding address is
  # oracle.SpamoorSenderAddr — pinned byte-for-byte by
  # internal/e2e_testing/spec_setup_test.go's drift gate.
  - kind: eoa
    name: spamoor-sender
    address: 0x7e5f4552091a69125d5dfcb7b8c2659029395bdf
    balance: "999999999000000000000000000"
    nonce: 0

  # ── 2-7. ERC-20 flavor coverage ──────────────────────────────────────
  # Every template-parameter permutation: explicit-address + bulk fill;
  # name-derived + bulk fill; position-derived + bulk fill; skeleton
  # (no synthesis); nonce override; explicit owners + allowances;
  # storage-bloat via approximate_size_bytes. decimals locked to 18
  # (OpenZeppelin v5 default; the template rejects other values).

  # 2. Explicit address + bulk random fill.
  - kind: contract
    template: erc20
    name: explicit-token
    address: 0x000000000000000000000000000000000000aaaa
    parameters:
      symbol: EXP
      decimals: 18
      name: Explicit
      total_owners: 50

  # 3. Name-derived address + bulk random fill.
  - kind: contract
    template: erc20
    name: named-token
    parameters:
      symbol: NMD
      decimals: 18
      name: NamedToken
      total_owners: 25

  # 4. Position-derived address (no name, no address) + bulk random fill.
  - kind: contract
    template: erc20
    parameters:
      symbol: ANO
      decimals: 18
      name: AnonToken
      total_owners: 10

  # 5. Skeleton ERC-20 — no total_owners, no approximate_size_bytes.
  # Produces only the explicit _name / _symbol slots, no _totalSupply.
  - kind: contract
    template: erc20
    name: skeleton-token
    parameters:
      symbol: SKL
      decimals: 18
      name: SkeletonToken

  # 6. ERC-20 with explicit nonce override (state-actor floors ERC-20
  # nonce to ≥1; this asks for 42 and asserts it lands).
  - kind: contract
    template: erc20
    name: nonce-overridden-token
    nonce: 42
    parameters:
      symbol: N42
      decimals: 18
      name: NonceOverride
      total_owners: 10

  # 7. ERC-20 sizing precedence: explicit total_owners WINS over
  # approximate_size_bytes. The erc20 template's approximate_size_bytes
  # fallback only fires when neither total_owners nor total_allowances is
  # set (internal/templates/erc20.go), so the 50_000 below is inert here
  # and present only to pin that precedence. (The fallback path itself is
  # unit-proven byte-equivalent to the total_owners path in erc20_test.go;
  # it is not a separate on-disk shape.)
  - kind: contract
    template: erc20
    name: bloated-erc20
    parameters:
      symbol: BLT
      decimals: 18
      name: BloatedToken
      total_owners: 20
    approximate_size_bytes: 50_000

  # ── 8-9. Explicit-owners + allowances coverage ───────────────────────
  # Schema permutations the bench-host's Phase D ERC-20 probe covers.

  # 8. Explicit owners + explicit allowances, no random fill.
  - kind: contract
    template: erc20
    name: token-explicit-owners
    address: 0x000000000000000000000000000000000000aa11
    parameters:
      symbol: AAA
      decimals: 18
      name: ExplicitOwnersToken
      owners:
        - { address: "0x1111111111111111111111111111111111111111", balance: "1000" }
        - { address: "0x2222222222222222222222222222222222222222", balance: "500" }
      allowances:
        - { owner: "0x1111111111111111111111111111111111111111", spender: "0x3333333333333333333333333333333333333333", allowance: "100" }

  # 9. Explicit AND random combined (multi-knob).
  - kind: contract
    template: erc20
    name: token-mixed
    address: 0x000000000000000000000000000000000000aa33
    parameters:
      symbol: CCC
      decimals: 18
      name: CombinedToken
      owners:
        - { address: "0x4444444444444444444444444444444444444444", balance: "1000000" }
      total_owners: 8
      allowances:
        - { owner: "0x4444444444444444444444444444444444444444", spender: "0x5555555555555555555555555555555555555555", allowance: "1000" }
      total_allowances: 4

  # ── 10-12. Raw bytecode flavors ──────────────────────────────────────

  # 10. Explicit address + small raw code + storage synth.
  - kind: contract
    name: raw-explicit
    address: 0x000000000000000000000000000000000000bbbb
    code: "0x6080604052348015600f57600080fd5b50603f80601d6000396000f3fe6080604052600080fdfea2"
    approximate_size_bytes: 20_000

  # 11. Name-derived address + code only (no synthesized storage).
  - kind: contract
    name: raw-named
    code: "0x60606040526000357c01000000000000000000000000000000000000000000000000000000009004"

  # 12. raw template with an explicit literal code blob (39 bytes here).
  # Exercises the raw-code writer path at a fixed address. The LARGE-code
  # writer path (near-EIP-170, byte-unique per address) is covered by
  # entity 29 (create2_deploys code_pattern), whose 24_576-byte runtimes
  # are byte-probed via eth_getCode on every client — keeping this entry
  # a small literal so the fixture file stays compact.
  - kind: contract
    name: raw-large
    address: 0x000000000000000000000000000000000000bbbc
    code: "0x6080604052600080fd000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"

  # ── 13-15. EIP-7702 EOA flavors ──────────────────────────────────────

  # 13. Explicit address + 7702 delegation + nonce override.
  - kind: eoa
    name: delegator-explicit
    address: 0x7777777777777777777777777777777777777777
    balance: "1000000000000000000"
    nonce: 10
    code: "0xef01001111111111111111111111111111111111111111"

  # 14. Name-derived + 7702 delegation + storage bloat (delegated EOAs
  # can carry storage just like contracts; the writer must place it
  # under the EOA's address).
  - kind: eoa
    name: bloated-validator
    balance: "1000000000000000000"
    nonce: 1
    code: "0xef01002222222222222222222222222222222222222222"
    approximate_size_bytes: 30_000

  # 15. Position-derived + 7702 delegation, no storage.
  - kind: eoa
    balance: "3000000000000000000"
    code: "0xef01003333333333333333333333333333333333333333"
    nonce: 5

  # ── 16-22. Plain EOA flavors ─────────────────────────────────────────

  # 16. Plain EOA, explicit address.
  - kind: eoa
    address: 0x3333333333333333333333333333333333333333
    balance: "5000000000000000000"
    nonce: 1

  # 17. Plain EOA, name-derived, non-zero nonce override.
  - kind: eoa
    name: plain-named-eoa
    balance: "2000000000000000000"
    nonce: 7

  # 18. Plain EOA, position-derived (neither name nor address set).
  - kind: eoa
    balance: "1000000000000000000"

  # 19. EOA with `approximate_size_bytes` (storage synthesis on a
  # plain EOA — typically used for fuzzing the slot writer).
  - kind: eoa
    name: bloated-eoa
    balance: "10000000000000000000"
    approximate_size_bytes: 25_000

  # 20. Zero-balance EOA (balance: "0" must be a no-op write that still
  # creates the account row).
  - kind: eoa
    name: zero-balance-eoa
    balance: "0"

  # 21. Hex-string balance form (the parser accepts both decimal and
  # 0x-prefixed; common when copy-pasting from cast / etherscan).
  - kind: eoa
    name: hex-balance-eoa
    balance: "0xde0b6b3a7640000"

  # 22. Plain EOA with default zero nonce (every other named EOA above
  # sets a non-zero nonce or explicit zero; this one omits the field
  # so the default-zero path is exercised).
  - kind: eoa
    name: default-nonce-eoa
    balance: "100000000000000000"

  # ── 23-29. PR 76 repricing-benchmark templates ───────────────────────
  # Instances of the six user-visible templates introduced in PR 76
  # (storage_pattern, create2_factory, create2_deploys,
  # create_preimage_deploys, sequential_eoas, sequential_pkey_eoas),
  # spanning each template's distinct writer-visible MODES: literal vs
  # code_pattern code (#25 vs #29), shared vs per-address-unique runtime,
  # storage_init on code-bearing derived contracts (#26), the 1-wei
  # default EOA (#27), and a custom entity-level nonce (#23). Scale stays
  # under the 500 KB total-fixture budget.
  #
  # Coverage layered against the existing unit tests:
  #   - internal/templates/<template>_test.go pins each iter's (key, value)
  #     output (correctness of what the iter emits).
  #   - This fixture drives the per-client writer path: each of
  #     geth/besu/nethermind/reth materializes the entities during
  #     TestE2ESuite, then Phase 4 RPC-probes them directly —
  #     eth_getCode (byte-exact, CheckInjections), eth_getTransactionCount
  #     (CheckInjections, exact when nonce>0), eth_getStorageAt (sampled,
  #     CheckSpecStorage) — AND the cross-client-genesis-root aggregator
  #     asserts all 4 roots agree. Both layers are needed: the root commits
  #     to CodeHash (shared code), so only the direct eth_getCode probe can
  #     catch a client persisting truncated/wrong code bytes.

  # 23. storage_pattern — dense-counter layout. slot 0 = final+1,
  # slot k = k for k in 1..final. Entity-level nonce/balance are honored
  # by this template; nonce: 42 (≠ the template's EIP-161 floor of 1)
  # gets an exact eth_getTransactionCount probe at L4, and the slot
  # layout is sampled by CheckSpecStorage.
  - kind: contract
    template: storage_pattern
    name: ci-storage-pattern
    address: 0x000000000000000000000000000000000000c0de
    nonce: 42
    balance: "1000000000000000000"
    parameters:
      final: 20

  # 24. create2_factory — Arachnid deterministic-deployment proxy
  # runtime. Address pinned by the template to the canonical
  # 0x4e59…956c; required for create2_deploys (#25) to reference it.
  - kind: contract
    template: create2_factory
    name: ci-create2-factory
    address: 0x4e59b44847b379578588920cA78FbF26c0B4956C

  # 25. create2_deploys — fans out salt_count contracts at
  # CREATE2-derived addresses. Uses canonical factory above.
  - kind: contract
    template: create2_deploys
    name: ci-create2-deploys
    parameters:
      initcode: "0x6001600052602060006000F0"
      runtime: "0x615fff565b"
      salt_count: 3

  # 26. create_preimage_deploys — fans out `count` contracts at
  # CREATE-derived addresses (keccak(rlp([sender, nonce]))[12:]).
  # Sender is a parameter, not the entity's own address. storage_init
  # plants the same slots on every derived contract, so these are
  # code-bearing AND storage-bearing accounts — CheckSpecStorage samples
  # the slots, exercising the per-client Phase-0 storage-root splice for
  # accounts that also carry code.
  - kind: contract
    template: create_preimage_deploys
    name: ci-create-preimage
    parameters:
      sender: "0x000000000000000000000000000000000000abcd"
      start_nonce: 2
      count: 3
      runtime: "0x615fff565b"
      storage_init:
        "0x0": "0x2a"
        "0x1": "0xcafe"
        "0x2": "0x000000000000000000000000000000000000abcd"

  # 27. sequential_eoas — fans out `count` plain EOAs at consecutive
  # addresses starting at the entity's resolved address. `balance` is
  # OMITTED on purpose: the template defaults to 1 wei (the minimum that
  # keeps a code-less, nonce-0 EOA off EIP-161's pruning path). This is
  # the only fixture entity that ships that 1-wei default through every
  # client writer — a client that prunes/normalizes such accounts at
  # genesis init would diverge the cross-client root.
  - kind: contract
    template: sequential_eoas
    name: ci-sequential-eoas
    address: 0x0000000000000000000000000000000000005000
    parameters:
      count: 3

  # 28. sequential_pkey_eoas — fans out `count` plain EOAs at addresses
  # derived from successive secp256k1 private keys starting at
  # `start_pkey`. Unlike sequential_eoas (sequential addresses), the
  # caller knows the pkey for each planted account.
  - kind: contract
    template: sequential_pkey_eoas
    name: ci-sequential-pkey-eoas
    parameters:
      start_pkey: "0x2222222222222222222222222222222222222222222222222222222222222222"
      count: 3
      balance: "1000000000000000000"

  # 29. create2_deploys in code_pattern mode — the ONLY entity that
  # drives a large, byte-UNIQUE-per-address code blob through every
  # client writer's code store. salt_count: 2 → two 24_576-byte runtimes
  # (the unique_jumpdest_pre_amsterdam pattern, each embedding its own
  # derived address) at the externally-pinned CREATE2 addresses
  # 0xEC9B…aAd8 (salt 0) and 0x59B3…c5Aa (salt 1). Uses the default
  # Arachnid factory — satisfied by entity 24. This is the gap the
  # cross-client root cannot close on its own: the root commits to
  # CodeHash (computed in shared code), so a client persisting truncated
  # or wrong code bytes still agrees on the root; only the byte-exact
  # eth_getCode probe (CheckInjections) catches it. ~49 KB of state.
  # APPENDED LAST so existing entities keep their 0-based index — and
  # thus their seed-derived addresses — unchanged.
  - kind: contract
    template: create2_deploys
    name: ci-create2-deploys-pattern
    parameters:
      code_pattern: unique_jumpdest_pre_amsterdam
      salt_count: 2
